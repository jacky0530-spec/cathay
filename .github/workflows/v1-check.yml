name: V1.0 靜態回歸與 Firebase 規則檢查
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 檢查靜態路徑、商品分類與 JavaScript 語法
        run: node scripts/check-v1.mjs
      - name: 驗證客戶資料合併與原資料保留
        run: node scripts/test-client-merge.mjs
      - name: 驗證 JSON 備份檔校驗工具（純本機／不傳輸）
        run: node scripts/test-backup-verify.mjs
      - name: 檢查 Spark VIP 管理頁語法
        run: node --check vip-access/spark/manager.mjs
      - name: 測試 VIP 停用／啟用交易（初次空快取與併發）
        run: node --test scripts/test-spark-toggle.mjs
      - name: 驗證管理員手動設定 VIP 碼與防重複保護
        run: node --test scripts/test-spark-manual-code.mjs
      - name: 檢查管理員登入不會等待授權清單而卡住
        run: node scripts/test-spark-login-stages.mjs
      - name: 檢查 Firebase REST 管理員權限及清單載入
        run: node scripts/test-spark-rest-admin.mjs
      - name: 驗證 VIP 永久刪除邏輯與管理員防呆
        run: node scripts/test-spark-retire-static.mjs
      - name: 驗證舊 VIP 帳號識別標籤修改與搜尋
        run: node scripts/test-spark-label-edit.mjs
      - name: 檢查已停售商品與商品頁快取
        run: |
          node scripts/test-products-discontinued.mjs
          node --check sw.js
      - name: 安裝 Firebase 本機模擬器測試套件
        run: npm install --no-audit --no-fund
      - name: 驗證匿名、使用者、管理員與失效帳號權限
        run: npm run test:rules
