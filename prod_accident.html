<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國泰人壽 - 傷害險全方位比較與試算 (更新XB費率)</title>
    <script src="auth.js"></script>

    <style>
        body {
            font-family: "Microsoft JhengHei", "Heiti TC", sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1200px; /* 增加總寬度以容納新欄位 */
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h1, h2 {
            color: #0056b3;
            text-align: center;
            margin-bottom: 20px;
        }
        h2 {
            font-size: 1.4em;
            margin-top: 40px;
            border-left: 5px solid #0056b3;
            padding-left: 15px;
            text-align: left;
        }
        
        /* 試算器區域 */
        .calculator-wrapper {
            background: linear-gradient(to bottom right, #e3f2fd, #ffffff);
            padding: 25px;
            border-radius: 10px;
            border: 1px solid #bbdefb;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .calculator-wrapper { grid-template-columns: 1fr; }
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #444;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1em;
            box-sizing: border-box; 
        }
        
        /* 比較表樣式 */
        .comparison-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 20px;
            font-size: 0.95em;
            background-color: #fff;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            overflow: hidden;
        }
        .comparison-table th {
            background-color: #0056b3;
            color: white;
            padding: 15px;
            text-align: center;
            position: sticky;
            top: 0;
            font-size: 1.05em;
        }
        .comparison-table td {
            border-bottom: 1px solid #dee2e6;
            border-right: 1px solid #dee2e6;
            padding: 12px 15px;
            vertical-align: middle;
        }
        .comparison-table td:last-child {
            border-right: none;
        }
        .comparison-table tr:last-child td {
            border-bottom: none;
        }
        
        /* 說明欄位樣式 */
        .explain-cell {
            background-color: #f8f9fa;
            color: #495057;
            font-size: 0.9em;
            line-height: 1.5;
            border-left: 2px solid #e9ecef;
        }
        .explain-highlight {
            color: #d63384;
            font-weight: bold;
        }

        /* 數字樣式 */
        .val-peace { color: #666; }
        .val-super { color: #0056b3; font-weight: bold; font-size: 1.1em; }

        /* 皇冠閃爍動畫 */
        @keyframes crown-pulse {
            0% { transform: scale(1); opacity: 1; filter: drop-shadow(0 0 2px gold); }
            50% { transform: scale(1.2); opacity: 0.8; filter: drop-shadow(0 0 8px gold); }
            100% { transform: scale(1); opacity: 1; filter: drop-shadow(0 0 2px gold); }
        }

        .crown-icon {
            display: inline-block;
            font-size: 1.4em; 
            margin-left: 8px;
            vertical-align: sub;
            animation: crown-pulse 1.5s infinite ease-in-out;
            cursor: default;
        }

        .diff-tag { 
            display: inline-block; 
            padding: 2px 6px; 
            border-radius: 4px; 
            font-size: 0.8em; 
            margin-left: 5px; 
            vertical-align: middle;
        }
        .tag-cheaper { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .tag-none { color: #aaa; font-style: italic; font-size: 0.9em; }
        
        /* 分類標題列 */
        .category-row {
            background-color: #e2e6ea !important;
            font-weight: bold;
            color: #333;
            text-align: left;
        }
        .sub-label {
            font-size: 0.85em;
            color: #666;
            display: block;
            margin-top: 2px;
        }

        /* 總保費列樣式 */
        .total-row {
            background-color: #fff3cd !important;
            font-weight: bold;
            font-size: 1.1em;
            border-top: 2px solid #ffc107;
        }
        .xb9-note {
            font-size: 0.8em;
            color: #d63384;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>國泰人壽 - 傷害險全方位比較與試算</h1>

    <div class="calculator-wrapper">
        <div style="grid-column: 1 / -1;">
            <h3 style="margin:0 0 15px 0; color:#0056b3;">步驟 1：設定投保條件</h3>
        </div>
        
        <div>
            <div class="input-group">
                <label>職業類別</label>
                <select id="occupationClass" onchange="updateAll()">
                    <option value="0">第一類 (行政/內勤)</option>
                    <option value="1">第二類 (外勤/輕勞力)</option>
                    <option value="2">第三類</option>
                    <option value="3">第四類</option>
                    <option value="4">第五類</option>
                    <option value="5">第六類</option>
                </select>
            </div>
            <div class="input-group">
