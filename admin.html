<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>使用者監控報表</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f7f6; padding: 20px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h2 { color: #333; margin: 0; }
        .refresh-btn { background: #00A651; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 14px; }

        /* 表格容器 */
        .table-container { background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); overflow-x: auto; }
        
        /* 表格寬度 */
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #fafafa; color: #666; font-weight: 600; font-size: 13px; }
        tr:hover { background: #f9f9f9; }

        /* 燈號 */
        .status-dot { height: 10px; width: 10px; background-color: #bbb; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .online { background-color: #2ecc71; box-shadow: 0 0 5px #2ecc71; }
        
        /* 標籤 */
        .badge { padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .badge-normal { background: #e0e0e0; color: #555; }
        .badge-warning { background: #fff3cd; color: #856404; }
        .badge-danger { background: #f8d7da; color: #721c24; }

        .device-info { font-size: 12px; color: #888; display: block; max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* 地址 */
        .location-text { font-size: 13px; color: #007bff; font-weight: 500; display:block; line-height: 1.4; }
        .location-error { color: #999; font-style: italic; font-size: 13px; }

        /* 按鈕 */
        .history-btn {
            cursor: pointer; padding: 6px 12px; 
            background: #17a2b8; color: white; 
            border: none; border-radius: 4px; font-size: 12px;
            transition: background 0.2s;
        }
        .history-btn:hover { background: #138496; }
        .history-btn:disabled { background: #ccc; cursor: not-allowed; }

    </style>
<script type="module" src="auth.js"></script>
</head>
<body>

    <div class="header">
        <div>
            <h2>📊 使用者監控報表</h2>
            <span style="font-size:12px; color:#888;">即時同步 Firebase 資料庫</span>
        </div>
        <button class="refresh-btn" onclick="location.reload()">重新整理</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th width="8%">連線狀態</th>
                    <th width="10%">帳號 UID／舊授權碼</th>
                    <th width="22%">登入地點 (最新)</th>
                    <th width="15%">最後登入</th>
                    <th width="8%">舊版踢除</th>
                    <th width="10%">足跡</th>
                    <th width="27%">登入裝置</th>
                </tr>
            </thead>
            <tbody id="userTableBody">
                <tr><td colspan="7" style="text-align:center;">載入資料中...</td></tr>
            </tbody>
        </table>
    </div>

    <script type="module">
        import { getApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const member=await window.cathayAuthReady;
if(!member || member.role!=='admin'){
  document.body.textContent='存取被拒絕：需要管理員權限。';
  throw new Error('Access denied');
}
const db=getDatabase(getApp());
const usersRef=ref(db,'users');
        
        let latestUsers=[];
        onValue(usersRef, (snapshot) => {
            const users = snapshot.val();
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = '';

            if (!users) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">目前無資料</td></tr>';
                return;
            }

            const userList = Object.keys(users).map(key => ({
                code: key,
                ...users[key]
            })).sort((a, b) => {
                if ((b.kickCount||0) !== (a.kickCount||0)) {
                    return (b.kickCount||0) - (a.kickCount||0);
                }
                return new Date(b.lastLogin) - new Date(a.lastLogin);
            });

            latestUsers=userList;
            userList.forEach((user,index) => {
                const connectionCount = user.connections && typeof user.connections==='object' ? Object.keys(user.connections).length : 0;
                const isOnline = connectionCount > 0;
                const kickCount = Number.isFinite(Number(user.kickCount)) ? Math.max(0,Math.floor(Number(user.kickCount))) : 0;
                
                let badgeClass = 'badge-normal';
                if (kickCount > 0) badgeClass = 'badge-warning';
                if (kickCount >= 3) badgeClass = 'badge-danger'; 

                let locDisplay = `<span class="location-error">未提供</span>`;
                if (user.location) {
                    if (user.location.includes("拒絕") || user.location.includes("錯誤") || user.location.includes("支援")) {
                        locDisplay = `<span class="location-error">${escapeHTML(user.location)}</span>`;
                    } else {
                        locDisplay = `<span class="location-text">📍 ${escapeHTML(user.location)}</span>`;
                    }
                }

                const histories = Array.isArray(user.loginHistory) ? user.loginHistory :
                    (user.loginHistory && typeof user.loginHistory==='object' ? Object.values(user.loginHistory) : []);
                const hasHistory = histories.length > 0;
                let historyBtn = `<button class="history-btn" disabled>無紀錄</button>`;
                
                if (hasHistory) {
                    historyBtn = '<button class="history-btn" onclick="showHistoryByIndex('+index+')">📋 查看</button>';
                }

                const row = `
                    <tr>
                        <td><span class="status-dot ${isOnline ? 'online' : ''}"></span>${isOnline ? '在線' : '離線'}</td>
                        <td style="font-weight:bold; color:#333;">${escapeHTML(user.code)}</td>
                        <td>${locDisplay}</td>
                        <td>${escapeHTML(formatLoginTime(user.lastLogin))}</td>
                        <td><span class="badge ${badgeClass}">${kickCount} 次</span></td>
                        <td>${historyBtn}</td>
                        <td><span class="device-info" title="${escapeHTML(user.device)}">${escapeHTML(formatDevice(user.device))}</span></td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        });

        function escapeHTML(value){return String(value==null?'':value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[ch]);}
        function formatLoginTime(value){
            if(value==null||value==='')return '無紀錄';
            if(typeof value==='number' || (typeof value==='string' && /^\\d{4}-\\d{2}-\\d{2}T/.test(value))){
                const date=new Date(value);
                if(Number.isFinite(date.getTime()))
                    return date.toLocaleString('zh-TW',{timeZone:'Asia/Taipei'});
            }
            return String(value);
        }
        function formatDevice(userAgent) {
            if (!userAgent) return '未知裝置';
            const match = userAgent.match(/\(([^)]+)\)/);
            if (match && match[1]) {
                return match[1].substring(0, 40) + '...'; 
            }
            return userAgent.substring(0, 30) + '...'; 
        }

        // 🔥 修改處：顯示完整時間
        window.showHistoryByIndex = function(index) {
            const user=latestUsers[index];
            if(!user)return;
            const events=Array.isArray(user.loginHistory)?user.loginHistory:
                (user.loginHistory&&typeof user.loginHistory==='object'?Object.values(user.loginHistory):[]);
            const jsonStr=JSON.stringify(events);
            const code=user.code;
            try {
                const history = JSON.parse(jsonStr);
                let msg = `【${code}】既有登入紀錄 (共 ${history.length} 筆)：\n\n`;
                
                history.forEach((item, index) => {
                    // 原本是 split(' ')[0] 只取日期，現在改為直接顯示 item.time
                    let timeDisplay = item.time || '未知時間';
                    msg += `${index + 1}. [${timeDisplay}] ${item.location}\n`;
                });
                
                alert(msg);
            } catch (e) {
                console.error(e);
                alert("讀取歷史紀錄失敗");
            }
        };

    </script>
</body>
</html>
