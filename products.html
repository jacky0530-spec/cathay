    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            padding-bottom: 90px; /* 預留底部選單空間 */
        }

        /* 分類標題樣式 */
        .section-title {
            color: #333;
            margin: 25px 0 15px 0;
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            border-left: 4px solid #00A651; /* 綠色標記 */
            padding-left: 10px;
        }
        .section-title:first-child { margin-top: 0; }

        /* 格狀佈局 (兩欄) */
        .grid-menu {
            display: grid;
            grid-template-columns: 1fr 1fr; 
            gap: 12px;
        }

        /* 一般按鈕樣式 (小方塊) */
        .prod-btn {
            background: white;
            border-radius: 12px;
            padding: 15px 10px;
            text-align: center;
            text-decoration: none;
            color: #444;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: transform 0.1s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 90px;
        }
        .prod-btn:active { transform: scale(0.96); background-color: #fafafa; }
        
        .icon { font-size: 28px; margin-bottom: 8px; }
        .name { font-size: 15px; font-weight: bold; line-height: 1.3; }

        /* 🔥 粉色醒目按鈕 (橫跨兩欄) */
        .highlight-pink {
            grid-column: span 2; /* 橫跨兩欄 */
            background: linear-gradient(135deg, #FFF0F5 0%, #FFE4E1 100%); /* 淺粉紅漸層 */
            border: 1px solid #FFB6C1;
            color: #C2185B; /* 深粉紅文字 */
            height: auto;
            padding: 15px 20px;
            display: flex;
            flex-direction: row; /* 橫向排列 */
            align-items: center;
            justify-content: space-between; /* 左右撐開 */
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            text-decoration: none;
        }
        
        .highlight-pink .icon-circle { 
            background: rgba(255,255,255,0.6);
            color: #E91E63;
            width: 45px; height: 45px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin-right: 15px;
            font-size: 24px;
        }
        .highlight-pink .name { font-size: 18px; text-align: left; margin-bottom: 0; color: #C2185B; }
        .highlight-pink .sub-text { font-size: 12px; opacity: 0.8; font-weight: normal; margin-top: 2px; color: #D81B60; }
        .highlight-pink .arrow { font-size: 20px; font-weight: bold; color: #E91E63; }

        /* 標籤 (熱銷/推薦) */
        .badge {
            background: #FF5252; color: white;
            font-size: 10px; padding: 2px 8px; border-radius: 10px;
            margin-left: 8px; vertical-align: middle;
        }

        /* 投資型按鈕微調 */
        .invest-btn .icon { filter: hue-rotate(45deg); }

    @media (min-width: 900px) { .comparison-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
</style>
